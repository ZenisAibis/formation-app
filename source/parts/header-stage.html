<header class="app">
  <div class="hgroup"><h1 class="brand">フォーメーション練習</h1><div class="title" id="hdrTitle"></div></div>
  <button id="btnUndo" class="hbtn" aria-label="元に戻す">↶ 戻す</button>
  <button id="btnRedo" class="hbtn" aria-label="やり直す" title="やり直す">↷</button>
  <button id="btnProj" class="hbtn">大きく表示</button>
</header>

<div id="ytBox" hidden>
  <div id="ytFrameWrap"></div>
  <div class="yt-bar">
    <span id="ytStatus" class="muted" role="status"></span>
    <button id="btnYtSync" class="small" title="動画の今の位置に、アプリの位置を合わせ直します">位置を合わせ直す</button>
    <button id="btnYtClose" class="small">動画を閉じる</button>
  </div>
</div>

<div id="stageWrap">
  <canvas id="stage" aria-label="ステージ図"></canvas>
  <div id="countBig"></div>
  <div id="meInfo"></div>
  <button id="projPlay" class="primary">▶</button>
  <button id="projExit">閉じる</button>
</div>
<div class="legend" id="stLegend"></div>

<div id="transport">
  <button id="btnBack" title="選んだ隊形の少し前へ" aria-label="選んだ隊形の少し前へ">⏮</button>
  <button id="btnPlay" class="primary">▶ 再生</button>
  <div class="count">
    <div id="countDisp" class="count-num">1-1</div>
    <div class="count-sub"><div class="beats" id="beats"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span id="timeDisp"></span></div>
  </div>
  <button id="btnRate" title="速さ（押すたびに切り替わります）">1倍</button>
</div>
<canvas id="timeline" aria-label="タイムライン"></canvas>
<div class="legend">● 隊形　━ 移動　◆ 照明・きっかけ　│ 今（なぞって移動）</div>

<!-- 練習 -->
<section class="tab" id="tab-practice">
  <div class="card">
    <label class="field">自分 <select id="meSel"></select></label>
    <div class="field">向き
      <div class="seg" id="viewSeg">
        <button data-view="audience" aria-pressed="true">客席から（正面が下）</button>
        <button data-view="dancer" aria-pressed="false">ダンサー目線（正面が上）</button>
      </div>
    </div>
    <div class="field">速さ
      <div class="seg" id="rateSeg">
        <button data-rate="0.5" aria-pressed="false">0.5倍</button>
        <button data-rate="0.75" aria-pressed="false">0.75倍</button>
        <button data-rate="1" aria-pressed="true">1倍</button>
      </div>
    </div>
    <div>
      <label class="switch"><input type="checkbox" id="showNames" checked> 名前を表示</label>
      <label class="switch"><input type="checkbox" id="showPaths"> 次の位置への矢印（全員）</label>
      <label class="switch"><input type="checkbox" id="clickOn"> カウント音（1拍ごとにクリック）</label>
    </div>
    <div class="hint">「自分」を選ぶと、自分の丸が大きくなり、次の立ち位置と移動の向きが出ます。プロジェクターに映すときは、上の「大きく表示」を使ってください（スペースキーで再生・停止）。</div>
  </div>
  <div class="card">
    <h3>書き出し</h3>
    <div class="row">
      <button id="btnSheet">全隊形を1枚の画像に</button>
      <button id="btnKeyPng">今の隊形を画像に</button>
      <button id="btnVideo">動画に書き出す</button>
    </div>
    <div class="hint" id="videoNote">動画は最初から最後まで実際の速さで再生しながら作ります。曲を読み込んでいると音も入ります。</div>
  </div>
</section>

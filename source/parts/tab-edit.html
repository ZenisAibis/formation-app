<!-- 編集 -->
<section class="tab on" id="tab-edit">
  <div class="sec-title">隊形</div>
  <div class="chips" id="keyChips"></div>
  <div class="row">
    <button id="btnAddKey">＋ 隊形を追加</button>
    <button id="btnAddCue">◆ 照明・きっかけ</button>
    <label class="switch"><input type="checkbox" id="snap" checked> 25cm刻み</label>
  </div>
  <div class="hint" id="editHint">丸をドラッグして動かします。タイムラインの ● で隊形、◆ で照明を選ぶと、ここに操作が出ます。</div>

  <!-- 選んだ隊形 -->
  <div class="card" id="cardKey" hidden>
    <div class="card-h"><h3 id="cardKeyTitle">隊形</h3><button class="ghost small" id="btnCloseKey">閉じる</button></div>
    <div class="row">
      <label>名前 <input type="text" id="kName" style="width:9em" maxlength="20"></label>
      <label>始まり <input type="number" id="kEight" min="1" step="1">-<input type="number" id="kCount" min="1" max="8" step="1" style="width:56px"></label>
      <label>移動 <input type="number" id="kMove" min="1" max="64" step="1" style="width:60px">カウント</label>
    </div>
    <div class="row">
      <button id="btnMirror">左右反転</button>
      <button id="btnCenter">中央に寄せる</button>
      <button id="btnDelKey">削除</button>
    </div>
    <div class="row">
      <select id="tplSel"></select>
      <button id="btnTpl">形を当てはめる</button>
    </div>
    <div class="hint">薄い丸と線は、ひとつ前の隊形からの動きです。黄色の×はクロスする場所です。</div>
  </div>

  <!-- 選んだ丸（ダンサー） -->
  <div class="card" id="cardDancer" hidden>
    <div class="card-h"><span class="sw" id="cardDancerSw"></span><h3 id="cardDancerName"></h3><button class="ghost small" id="btnCloseDancer">閉じる</button></div>
    <p class="kv" id="cardDancerPos"></p>
    <div class="hint">ドラッグで動かせます。</div>
    <div class="row"><button id="btnSetMe">この人を「自分」にする</button></div>
  </div>

  <!-- 選んだ照明・きっかけ（直すとすぐ反映。元に戻すで戻せる） -->
  <div class="card" id="cardCue" hidden>
    <div class="card-h"><h3>◆ 照明・きっかけ</h3><button class="ghost small" id="btnCloseCue">閉じる</button></div>
    <div class="chips" id="cueChips"></div>
    <div class="row">
      <select id="cKind"></select>
      <input type="text" id="cName" maxlength="20" placeholder="名前（例：サビ前の暗転）" style="width:12em">
      <label>色 <input type="color" id="cColor" value="#7a5cff"></label>
      <label>当てる人 <select id="cTarget"></select></label>
    </div>
    <div class="row">
      <label>時刻 <input type="number" id="cEight" min="1" step="1">-<input type="number" id="cCount" min="1" max="8" step="1" style="width:56px"></label>
      <label>フェード <input type="number" id="cFade" min="0" max="32" step="1" style="width:60px">カウント</label>
    </div>
    <div class="row"><button id="btnDelCue">削除</button></div>
    <div class="hint">変えるとすぐ反映されます（元に戻すで戻せます）。照明が変わる所や、音のきっかけ（歌い出し・ドラムなど）を入れると、練習画面と動画に「あと何カウント」で出ます。暗転中も立ち位置は線で見えます。</div>
  </div>
</section>

<!-- アドバイス -->
<section class="tab" id="tab-advice">
  <div class="card">
    <div class="summary" id="advSummary"></div>
    <div class="row">
      <button class="primary" id="btnImprove">まとめて改善して完成形へ</button>
    </div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="allowSwap" checked> 立ち位置の入れ替えも許可</label>
      <label class="switch"><input type="checkbox" id="compare"> ベース（改善前）を点線で重ねる</label>
    </div>
    <div class="row">
      <button class="small" id="btnRestoreBase">ベースに戻す</button>
      <button class="small" id="btnSetBase">今の形をベースにする</button>
    </div>
    <div class="row">
      <button class="small" id="btnAiText">AIに相談する文章をコピー</button>
    </div>
    <div class="hint">Claude や ChatGPT に貼ると、振付の観点の意見をもらえます。</div>
  </div>
  <div id="advList"></div>
</section>
